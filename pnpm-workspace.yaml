minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - "@dnd-mapp/*"
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 4320 # 3 days

# Peer Dependency Settings
autoInstallPeers: false
dedupePeers: true
strictPeerDependencies: true

# CLI Settings
engineStrict: true

# Build Settings
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  lefthook: true
  lmdb: false
  msgpackr-extract: false
sideEffectsCache: false

# Other Settings
catalogMode: "strict"
savePrefix: "~"

catalog:
  "@dnd-mapp/config-typescript": ~1.1.0
  "@dnd-mapp/design-tokens": ~1.0.0
  "@types/node": ~24.19.0
  typescript: ~6.0.3
catalogs:
  angular:
    "@angular/build": ~22.2.0
    "@angular/cli": ~22.2.0
    "@angular/common": ~22.2.0
    "@angular/compiler": ~22.2.0
    "@angular/compiler-cli": ~22.2.0
    "@angular/core": ~22.2.0
    "@angular/platform-browser": ~22.2.0
    ng-packagr: ~22.2.1
    rxjs: ~7.8.2
    tslib: ~2.8.1
  commitlint:
    "@commitlint/cli": ~21.2.3
    "@dnd-mapp/config-commitlint": ~1.1.0
    lefthook: ~2.1.14
  eslint:
    "@dnd-mapp/config-eslint": ~1.1.0
    angular-eslint: ~22.5.0
    eslint: ~10.11.0
    typescript-eslint: ~8.70.1
  markdown:
    "@dnd-mapp/config-markdown": ~1.0.0
    markdownlint-cli2: ~0.23.3
  prettier:
    "@dnd-mapp/config-prettier": ~1.1.0
    prettier: ~3.9.9
    prettier-plugin-organize-imports: ~4.3.0
  vitest:
    "@vitest/coverage-v8": ~5.0.2
    "@vitest/ui": ~5.0.2
    jsdom: ~30.1.1
    vitest: ~5.0.2
