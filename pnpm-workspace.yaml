minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - "@dnd-mapp/*"
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 4320 # 3 days

# Peer Dependency Settings
autoInstallPeers: false
dedupePeers: true
strictPeerDependencies: true

# CLI Settings
engineStrict: true

# Build Settings
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  lefthook: true
  lmdb: false
  msgpackr-extract: false
sideEffectsCache: false

# Other Settings
catalogMode: "strict"
savePrefix: "~"

catalog:
  "@dnd-mapp/changelog-tools": ~1.2.0
  "@dnd-mapp/config-typescript": ~1.1.0
  "@dnd-mapp/design-tokens": ~1.0.0
  "@types/node": ~24.19.1
  typescript: ~6.0.3
catalogs:
  angular:
    "@angular/animations": ~22.2.1
    "@angular/build": ~22.2.1
    "@angular/cdk": ~22.2.1
    "@angular/cli": ~22.2.1
    "@angular/common": ~22.2.1
    "@angular/compiler": ~22.2.1
    "@angular/compiler-cli": ~22.2.1
    "@angular/core": ~22.2.1
    "@angular/forms": ~22.2.1
    "@angular/platform-browser": ~22.2.1
    ng-packagr: ~22.2.4
    rxjs: ~7.8.2
    tslib: ~2.8.1
  commitlint:
    "@commitlint/cli": ~21.2.3
    "@dnd-mapp/config-commitlint": ~1.1.0
    lefthook: ~2.1.16
  eslint:
    "@dnd-mapp/config-eslint": ~1.1.0
    angular-eslint: ~22.5.0
    eslint: ~10.11.0
    eslint-plugin-storybook: ~10.6.1
    typescript-eslint: ~8.71.0
  markdown:
    "@dnd-mapp/config-markdown": ~1.0.0
    markdownlint-cli2: ~0.23.3
  prettier:
    "@dnd-mapp/config-prettier": ~1.1.0
    prettier: ~3.9.9
    prettier-plugin-organize-imports: ~4.3.0
  storybook:
    "@analogjs/vite-plugin-angular": ~2.8.0
    "@storybook/addon-docs": ~10.6.1
    "@storybook/addon-themes": ~10.6.1
    "@storybook/angular-vite": ~10.6.1
    "@types/react": ~19.3.0
    react: ~19.3.0
    remark-gfm: ~4.0.1
    sass: ~1.105.1
    storybook: ~10.6.1
    vite: ~8.3.2
  vitest:
    "@vitest/browser-playwright": ~5.0.3
    "@vitest/coverage-v8": ~5.0.3
    "@vitest/ui": ~5.0.3
    playwright: ~1.63.0
    vitest: ~5.0.3
