name: Push main

on:
    push:
        branches:
            - main

jobs:
    ci:
        name: CI
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Run CI checks
              uses: ./.github/actions/ci

    build-storybook:
        name: Build Storybook
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}-build-storybook
            cancel-in-progress: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Build Storybook
              uses: ./.github/actions/build-storybook

    deploy-storybook:
        name: Deploy Storybook
        needs: build-storybook
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: write
        concurrency:
            group: ${{ github.workflow }}-deploy-storybook
            cancel-in-progress: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Download Storybook
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: storybook
                  path: ${{ runner.temp }}/storybook

            - name: Deploy Storybook
              uses: ./.github/actions/deploy-storybook
              with:
                  path: ${{ runner.temp }}/storybook
                  target: main
                  root-redirect: main

    tag:
        name: Tag release
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions: {}
        concurrency:
            group: ${{ github.workflow }}-tag
            cancel-in-progress: false
        steps:
            - name: Tag the release
              uses: dnd-mapp/action-tag-release@4dd5358fba157c26f18e63250502476108d9fa43 # v1.0.0
              with:
                  client-id: ${{ vars.GH_APP_CLIENT_ID }}
                  private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
                  manifest: projects/ui/package.json
