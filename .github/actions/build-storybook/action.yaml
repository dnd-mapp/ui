name: Build Storybook
description: Installs dependencies, builds the static Storybook, and uploads it as the storybook artifact

runs:
    using: composite
    steps:
        - name: Set up Node.js and pnpm and install dependencies
          uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
          with:
              cache: true
              runtime: node
              require-lockfile: true

        - name: Build Storybook
          shell: bash
          run: pnpm run build-storybook

        - name: Upload Storybook
          uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
          with:
              name: storybook
              path: dist/storybook
              if-no-files-found: error
              retention-days: 1
