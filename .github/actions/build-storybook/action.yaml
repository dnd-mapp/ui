name: Build Storybook
description: Installs dependencies, builds the static Storybook, and uploads it as the storybook artifact

runs:
    using: composite
    steps:
        - name: Set up Node.js and pnpm and install dependencies
          uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
          with:
              cache: true
              runtime: node
              require-lockfile: true

        - name: Build Storybook
          shell: bash
          run: pnpm run build-storybook

        - name: Upload Storybook
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          with:
              name: storybook
              path: dist/storybook
              if-no-files-found: error
              retention-days: 1
